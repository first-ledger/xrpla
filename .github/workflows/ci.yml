name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y g++-12 ninja-build
      - run: python -m pip install conan==2.17.1
      - name: Resolve transport dependencies
        env:
          CC: gcc-12
          CXX: g++-12
        # conan.lock pins revisions (openssl among them) that only XRPLF's remote serves, as
        # in Dockerfile and Dockerfile.core.
        run: |
          conan profile detect --force
          conan remote add xrplf https://conan.xrplf.org/repository/conan/ --force
          conan install . -of build --build=missing -s compiler.cppstd=20 -s build_type=Release -c tools.build:jobs=2 -o '&:with_libxrpl=False'
      - name: Build and test
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          cmake -S . -B build/Release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$PWD/build/generators/conan_toolchain.cmake"
          cmake --build build/Release -j 2
          ctest --test-dir build/Release --output-on-failure
  canonical-core:
    runs-on: ubuntu-24.04
    steps:
      # The dependency build, its tests and the layer cache need more room than the runner
      # leaves free; the SDKs removed here are unused.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.core
          target: runtime
          tags: xrpla-core:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Portable runtime smoke test
        run: docker run --rm xrpla-core:local --version
      - name: Build genuine upstream test servers
        if: github.event_name == 'workflow_dispatch'
        run: docker build -f Dockerfile.integration -t xrpla-integration:local .
      - name: Native imports and Clio RPC conformance
        if: github.event_name == 'workflow_dispatch'
        run: python3 tests/native_integration.py
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: native-validation
          path: .cache/native-integration.json
